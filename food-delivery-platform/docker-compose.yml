services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "29092:29092"   # host access (bal run locally)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    volumes:
      - ./scripts/init-topics.sh:/init-topics.sh:ro

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  customer-service:
    build: ./services/customer
    ports: ["9091:9091"]
    environment: &env
      BAL_CONFIG_VAR_KAFKABROKER: kafka:9092
      BAL_CONFIG_VAR_MONGOURI: mongodb://mongo:27017
    depends_on: &deps
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_started
    restart: on-failure

  restaurant-service:
    build: ./services/restaurant
    ports: ["9092:9092"]
    environment: *env
    depends_on: *deps
    restart: on-failure

  order-service:
    build: ./services/order
    ports: ["9093:9093"]
    environment: *env
    depends_on: *deps
    restart: on-failure

  payment-service:
    build: ./services/payment
    ports: ["9094:9094"]
    environment: *env
    depends_on: *deps
    restart: on-failure

  delivery-service:
    build: ./services/delivery
    ports: ["9095:9095"]
    environment: *env
    depends_on: *deps
    restart: on-failure

  notification-service:
    build: ./services/notification
    ports: ["9096:9096"]
    environment: *env
    depends_on: *deps
    restart: on-failure

  admin-service:
    build: ./services/admin
    ports: ["9097:9097"]
    environment: *env
    depends_on: *deps
    restart: on-failure

volumes:
  mongo-data:
